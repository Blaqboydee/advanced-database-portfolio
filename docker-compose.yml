# Local databases for the portfolio.
#   PostgreSQL (Portfolios 1-3, system of record):  docker compose up -d
#   + NoSQL databases (Portfolio 4):                docker compose --profile nosql up -d
# Stop:   docker compose --profile nosql down        (add -v to wipe the data volumes)
# All passwords below are for local development only.
services:
  postgres:
    image: postgres:16
    container_name: owotrust-pg
    environment:
      POSTGRES_USER: owotrust
      POSTGRES_PASSWORD: owotrust_dev
      POSTGRES_DB: owotrust_bank
      TZ: Africa/Lagos
      PGTZ: Africa/Lagos
    ports:
      - "5433:5432"                     # 5433 on the host to avoid clashing with any local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/portfolio:ro                # repo mounted read-only so psql can run the scripts with -f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owotrust -d owotrust_bank"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Portfolio 4: NoSQL ------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: owotrust-mongo
    profiles: ["nosql"]
    # single-node replica set: required for multi-document transactions
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
      - ./:/portfolio:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    container_name: owotrust-redis
    profiles: ["nosql"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: owotrust-neo4j
    profiles: ["nosql"]
    environment:
      NEO4J_AUTH: neo4j/owotrust_dev
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7475:7474"                     # browser UI: http://localhost:7475
      - "7688:7687"
    volumes:
      - neo4jdata:/data
      - ./portfolio-4-nosql/data:/var/lib/neo4j/import      # CSV files for LOAD CSV (Neo4j needs it writable)
      - ./:/portfolio:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p owotrust_dev 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  mongodata:
  neo4jdata:
